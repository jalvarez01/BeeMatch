# Integración continua (C25): se ejecuta en cada push y en cada PR hacia
# development y main. Las mismas comprobaciones que antes se hacían a mano al
# revisar un PR: estilo, pruebas, lint y compilación del frontend.
name: CI

on:
  push:
    branches: [development, main]
  pull_request:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend (ruff y pytest sobre SQLite)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: backend/requirements.txt

      - name: Instalar dependencias
        run: pip install -r backend/requirements.txt ruff==0.16.8

      - name: Ruff
        run: ruff check .

      - name: Pruebas
        run: python -m pytest -q

  frontend:
    name: Frontend (lint, pruebas y compilación)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      # Node 22 o superior: `npm test` usa node --test con TypeScript.
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Pruebas
        run: npm test

      - name: Compilar
        run: npm run build
