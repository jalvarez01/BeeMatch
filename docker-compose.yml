services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: beematch
      POSTGRES_PASSWORD: beematch
      POSTGRES_DB: beematch
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  api:
    build:
      context: .
      dockerfile: backend/dockerfile
    environment:
      DATABASE_URL: postgresql+psycopg://beematch:beematch@db:5432/beematch
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    ports:
      - "8000:8000"
    depends_on:
      - db
      - redis

  worker:
    build:
      context: .
      dockerfile: backend/dockerfile
    command: rq worker beematch --url redis://redis:6379/0
    environment:
      DATABASE_URL: postgresql+psycopg://beematch:beematch@db:5432/beematch
      REDIS_URL: redis://redis:6379/0
    env_file:
      - .env
    depends_on:
      - db
      - redis

  frontend:
    build:
      context: ./frontend
      dockerfile: dockerfile
    ports:
      - "5173:5173"
    depends_on:
      - api

volumes:
  pgdata:
